# Semantic symbol table for mods (NP-7.2), for the supported executable in
# config/supported-dumps.json. Mods find guest addresses and struct offsets by
# these names (PinyonModApi::find_symbol, find_offset), never by literal
# addresses. tools/generate-fh1-symbols.py turns this file, plus every
# [[midasm_hook]] site in config/rexglue/analysis/main-xex.toml (as
# "hook.<name>"), into src/mod/fh1_symbols.inc; tools/tests/test_fh1_symbols.py
# fails when the two disagree.

executable = "default.xex"
sha256 = "DB40DF605ADE49A6"  # prefix of the supported default.xex SHA-256

# Hook sites behind the PinyonHook ids, and functions a mod may call through a
# guest task. Every address here must also be a hook site or a function start
# in the generated code.
[symbols]
"frame.tick" = 0x823EDA10                # main loop, once per title frame
"simulation.delta_store" = 0x823EDB84    # the variable gameplay delta (f31) is stored
"vehicle.pose_written" = 0x82BC5A3C      # the active vehicle slot's pose is final
"save.before_encrypt" = 0x82C666D0       # plaintext save body (r4) and size (r5)
"ui.pause_button_constructed" = 0x8264FC08
"ui.pause_menu_action" = 0x82739D00      # CPauseMenu action switch (sub_82739D00)
"gpu.fence_wait_predicate" = 0x829F04A8  # D3D fence-wait predicate (sub_829F04A8)
"graphics.frame" = 0x829EFEB8            # graphics frame boundary
"kernel.get_av_pack" = 0x831EDA6C        # XGetAVPack import thunk: returns the AV pack, no side effects
"camera.count" = 0x82486C40              # r3 world -> r3 number of camera controllers
"camera.controller" = 0x82486C70         # r3 world, r4 index -> r3 camera controller
"camera.set_mode" = 0x82858638           # r3 camera controller, r4 mode (6 is the free camera)
"camera.player_controller" = 0x82486B40  # r3 world, r4 index -> r3 player camera
"camera.reset_to_player" = 0x825A86F8    # r3 player camera from camera.player_controller
"time_of_day.from_world" = 0x82486CF0    # r3 world -> r3 its time-of-day object ([world + 232])
"time_of_day.request" = 0x825C7DD0       # r3 time-of-day object, f1 target seconds (add 86400 to pass midnight), f2 game seconds per second
"time_of_day.update" = 0x825CB718        # per-frame clock and lighting update, r3 time-of-day object
"world.game_mode" = 0x824878D0           # r3 world -> r3 game mode ([[world + 124] + 56]): 17 free roam, 3 inside an event (entry, race, results)

# Byte offsets inside title objects, as the hooks above read them.
[offsets]
"main_loop.delta" = 448                  # float seconds at owner+448
"vehicle.active_slot" = 1500             # u32 index into the slot array
"vehicle.slot_stride" = 1056
"vehicle.slot.position" = 15120          # float4 x, y, z, w within a slot
"vehicle.slot.forward" = 15184           # float4 forward vector within a slot
"world.time_of_day" = 232                # time-of-day object pointer in the world
"time_of_day.seconds" = 10488            # float seconds since midnight, advanced by time_of_day.update
"time_of_day.script_hold" = 10505        # u8, set while a script holds the time (setters then skip it)
"world.session" = 124                    # pointer to the object holding the game mode
"session.game_mode" = 56                 # u32 game mode, as world.game_mode returns it
